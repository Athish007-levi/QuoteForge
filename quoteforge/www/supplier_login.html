{% extends "templates/web.html" %}
{% block page_content %}

<div class="qf-login-wrapper">
  <div class="qf-card">
    <div class="qf-card-header">
      <h2>Supplier Login</h2>
      <p>Welcome back! Please enter your details.</p>
    </div>

    <form id="supplierLoginForm">
      <div class="qf-field">
        <label for="email">Email</label>
        <input type="email" id="email" class="qf-input" placeholder="name@company.com" required>
      </div>

      <div class="qf-field">
        <label for="password">Password</label>
        <input type="password" id="password" class="qf-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="qf-btn qf-btn-primary">
        Login
      </button>
    </form>

    <div class="qf-footer-links">
      <a href="/update-password">Forgot Password?</a>
      <div class="qf-divider"></div>
      <p style="margin: 0;">
        New Supplier? <a href="/supplier_register">Register Here</a>
      </p>
    </div>
  </div>
</div>

<style>
  .qf-login-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
    padding: 20px 15px;
  }

  .qf-card {
    background: #ffffff;
    max-width: 440px;
    width: 100%;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    border: 1px solid #e2e8f0;
  }

  .qf-card-header {
    text-align: center;
    margin-bottom: 28px;
  }

  .qf-card-header h2 {
    font-size: 1.75rem;
    font-weight: 700;
    color: #0f172a;
    margin: 0 0 6px 0;
  }

  .qf-card-header p {
    color: #64748b;
    font-size: 0.9rem;
    margin: 0;
  }

  .qf-field {
    margin-bottom: 20px;
  }

  .qf-field label {
    display: block;
    font-weight: 600;
    font-size: 0.875rem;
    color: #334155;
    margin-bottom: 6px;
  }

  .qf-input {
    width: 100%;
    padding: 10px 14px;
    font-size: 0.95rem;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    outline: none;
    transition: all 0.2s ease-in-out;
    background-color: #f8fafc;
    color: #1e293b;
  }

  .qf-input:focus {
    border-color: #2563eb;
    background-color: #ffffff;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .qf-btn-primary {
    width: 100%;
    padding: 11px;
    background-color: #2563eb;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.1s ease;
    margin-top: 8px;
  }

  .qf-btn-primary:hover {
    background-color: #1d4ed8;
  }

  .qf-btn-primary:active {
    transform: scale(0.99);
  }

  .qf-footer-links {
    margin-top: 24px;
    text-align: center;
    font-size: 0.875rem;
    color: #64748b;
  }

  .qf-footer-links a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
  }

  .qf-footer-links a:hover {
    text-decoration: underline;
  }

  .qf-divider {
    height: 1px;
    background-color: #f1f5f9;
    margin: 20px 0;
  }
</style>

<script>
document.getElementById("supplierLoginForm").addEventListener("submit", function(e){
    e.preventDefault();
    frappe.call({
        method: "quoteforge.api.login_supplier",
        args: {
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
        },
        callback: function(r){
            if(!r.exc){
                window.location.href = "/open_rfqs";
            }
        }
    });
});
</script>

{% endblock %}
