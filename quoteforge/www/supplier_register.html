{% extends "templates/web.html" %}
{% block page_content %}

<div class="qf-register-wrapper">
  <div class="qf-card">
    <div class="qf-card-header">
      <h2>Supplier Registration</h2>
      <p>Fill out the form below to become an authorized supplier.</p>
    </div>

    <form id="supplierRegisterForm">
      <div class="qf-grid-2">
        <div class="qf-field">
          <label for="company_name">Company Name</label>
          <input type="text" id="company_name" class="qf-input" placeholder="Acme Corp" required>
        </div>

        <div class="qf-field">
          <label for="contact_person">Contact Person</label>
          <input type="text" id="contact_person" class="qf-input" placeholder="John Doe" required>
        </div>
      </div>

      <div class="qf-grid-2">
        <div class="qf-field">
          <label for="email">Email</label>
          <input type="email" id="email" class="qf-input" placeholder="john@company.com" required>
        </div>

        <div class="qf-field">
          <label for="phone">Phone</label>
          <input type="text" id="phone" class="qf-input" placeholder="+1 234 567 890" required>
        </div>
      </div>

      <div class="qf-field">
        <label for="gst_number">GST Number</label>
        <input type="text" id="gst_number" class="qf-input" placeholder="22AAAAA0000A1Z5">
      </div>

      <div class="qf-field">
        <label for="address">Address</label>
        <textarea id="address" class="qf-textarea" placeholder="Full business address..."></textarea>
      </div>

      <div class="qf-field">
        <label for="business_profile">Business Profile</label>
        <textarea id="business_profile" class="qf-textarea" placeholder="Brief description of products/services offered..."></textarea>
      </div>

      <button type="submit" class="qf-btn qf-btn-primary">
        Register
      </button>
    </form>
  </div>
</div>


<style>
  .qf-register-wrapper {
    display: flex;
    justify-content: center;
    padding: 30px 15px;
  }

  .qf-card {
    background: #f4f2f0;
    max-width: 680px;
    width: 100%;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    border: 1px solid #e2e8f0;
  }

  .qf-card-header {
    margin-bottom: 30px;
    border-bottom: 1px solid #f1f5f9;
    padding-bottom: 16px;
  }

  .qf-card-header h2 {
    font-size: 1.75rem;
    font-weight: 700;
    color: #0f172a;
    margin: 0 0 6px 0;
  }

  .qf-card-header p {
    color: #64748b;
    font-size: 0.9rem;
    margin: 0;
  }

  .qf-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 600px) {
    .qf-grid-2 {
      grid-template-columns: 1fr;
    }
  }

  .qf-field {
    margin-bottom: 20px;
  }

  .qf-field label {
    display: block;
    font-weight: 600;
    font-size: 0.875rem;
    color: #334155;
    margin-bottom: 6px;
  }

  .qf-input, .qf-textarea {
    width: 100%;
    padding: 10px 14px;
    font-size: 0.95rem;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    outline: none;
    transition: all 0.2s ease-in-out;
    background-color: #f8fafc;
    color: #1e293b;
    font-family: inherit;
  }

  .qf-textarea {
    resize: vertical;
    min-height: 80px;
  }

  .qf-input:focus, .qf-textarea:focus {
    border-color: #2563eb;
    background-color: #ffffff;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .qf-btn-primary {
    width: 100%;
    padding: 12px;
    background-color: #2563eb;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.1s ease;
    margin-top: 10px;
  }

  .qf-btn-primary:hover {
    background-color: #1d4ed8;
  }

  .qf-btn-primary:active {
    transform: scale(0.99);
  }
</style>

<script>
document.getElementById("supplierRegisterForm").addEventListener("submit", function(e){
    e.preventDefault();
    frappe.call({
        method: "quoteforge.api.register_supplier",
        args: {
            company_name: document.getElementById("company_name").value,
            contact_person: document.getElementById("contact_person").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            address: document.getElementById("address").value,
            gst_number: document.getElementById("gst_number").value,
            business_profile: document.getElementById("business_profile").value
        },
        callback: function(r){
            if(!r.exc){
                alert(r.message.message);
                document.getElementById("supplierRegisterForm").reset();
            }
        }
    });
});
</script>

{% endblock %}
