{% extends "templates/web.html" %}

{% block page_content %} 
<div class="qf-card">
    <h2>Supplier Registration</h2>

    <form id="supplierRegisterForm">

        <div class="qf-field">
            <label>Company Name</label>
            <input type="text" id="company_name" class="qf-input" required>
        </div>

        <div class="qf-field">
            <label>Contact Person</label>
            <input type="text" id="contact_person" class="qf-input" required>
        </div>

        <div class="qf-field">
            <label>Email</label>
            <input type="email" id="email" class="qf-input" required>
        </div>

        <div class="qf-field">
            <label>Phone</label>
            <input type="text" id="phone" class="qf-input" required>
        </div>

        <div class="qf-field">
            <label>Address</label>
            <textarea id="address" class="qf-textarea"></textarea>
        </div>

        <div class="qf-field">
            <label>GST Number</label>
            <input type="text" id="gst_number" class="qf-input">
        </div>

        <div class="qf-field">
            <label>Business Profile</label>
            <textarea id="business_profile" class="qf-textarea"></textarea>
        </div>

        <button type="submit" class="qf-btn qf-btn-primary">
            Register
        </button>

    </form>
</div>

<script>

document.getElementById("supplierRegisterForm").addEventListener("submit", function(e){

    e.preventDefault();

    frappe.call({

        method: "quoteforge.api.register_supplier",

        args: {

            company_name: document.getElementById("company_name").value,

            contact_person: document.getElementById("contact_person").value,

            email: document.getElementById("email").value,

            phone: document.getElementById("phone").value,

            address: document.getElementById("address").value,

            gst_number: document.getElementById("gst_number").value,

            business_profile: document.getElementById("business_profile").value

        },

        callback: function(r){

            if(!r.exc){

                alert(r.message.message);

                document.getElementById("supplierRegisterForm").reset();

            }

        }

    });

});

</script>
{% endblock %}
